<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grupo Capital Máquinas | Maquinaria Industrial de Confección</title>
  <meta name="description" content="Línea industrial de confección, bordado, corte y planchado. Grupo Capital Máquinas."/>
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="apple-touch-icon" href="logo.png"/>
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Shared Config & Components -->
  <script src="db-service.js"></script>
  <script src="shared.js"></script>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="bg-white text-slate-800 font-body antialiased" data-page="inventario">

<!-- ═══ NAVBAR (inyectado dinámicamente por shared.js) ═══ -->
<div id="navbar-placeholder"></div>

<!-- ═══ MAIN CONTENT ═══ -->
<main class="w-full" role="main">

  <!-- ── 1. HERO BANNER ("Descubre la Innovación") ── -->
  <section class="carousel-container relative w-full h-[440px] sm:h-[500px] overflow-hidden bg-slate-950" aria-label="Banner principal">
    <div id="carousel-slides" class="w-full h-full"></div>
    
    <!-- Nav Arrows -->
    <button class="absolute left-4 sm:left-6 top-1/2 -translate-y-1/2 z-40 p-2 text-white/50 hover:text-white transition-colors duration-300 opacity-0 group-hover:opacity-100" id="prevBtn" aria-label="Slide anterior">
      <span class="material-symbols-outlined text-4xl">chevron_left</span>
    </button>
    <button class="absolute right-4 sm:right-6 top-1/2 -translate-y-1/2 z-40 p-2 text-white/50 hover:text-white transition-colors duration-300 opacity-0 group-hover:opacity-100" id="nextBtn" aria-label="Slide siguiente">
      <span class="material-symbols-outlined text-4xl">chevron_right</span>
    </button>
    
    <!-- Indicators -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-40 flex gap-2">
      <button class="indicator w-2.5 h-2.5 rounded-full bg-white active-indicator" data-index="0" aria-label="Slide 1"></button>
      <button class="indicator w-2.5 h-2.5 rounded-full bg-white/40 hover:bg-white transition-all duration-300" data-index="1" aria-label="Slide 2"></button>
      <button class="indicator w-2.5 h-2.5 rounded-full bg-white/40 hover:bg-white transition-all duration-300" data-index="2" aria-label="Slide 3"></button>
    </div>
    
    <!-- Progress Bar -->
    <div class="absolute bottom-0 left-0 w-full h-1 z-40 flex">
      <div class="h-full w-0 bg-blue-600 transition-all duration-[5000ms] linear" id="progress-bar"></div>
      <div class="h-full flex-1 bg-white/10"></div>
    </div>
  </section>

  <!-- ── 2. TIRA DE MARCAS DESTACADAS (Fondo Oscuro) ── -->
  <section id="sec-marcas" class="bg-[#181E29] py-5 px-4 sm:px-8 border-b border-slate-800" aria-label="Marcas destacadas">
    <div class="max-w-[1440px] mx-auto">
      <h2 class="text-center text-xs font-bold font-headline text-white uppercase tracking-wider mb-4">Marcas Destacadas</h2>
      <div class="relative flex items-center justify-center gap-3">
        <!-- Scroll Left -->
        <button onclick="scrollBrands(-1)" class="w-8 h-8 rounded-full bg-slate-800/80 hover:bg-slate-700 text-white flex items-center justify-center shrink-0 border border-slate-700 transition-all">
          <span class="material-symbols-outlined text-base">chevron_left</span>
        </button>
        
        <div id="brands-list" class="flex items-center gap-3 overflow-x-auto scroll-smooth no-scrollbar py-1"></div>

        <!-- Scroll Right -->
        <button onclick="scrollBrands(1)" class="w-8 h-8 rounded-full bg-slate-800/80 hover:bg-slate-700 text-white flex items-center justify-center shrink-0 border border-slate-700 transition-all">
          <span class="material-symbols-outlined text-base">chevron_right</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ── 3. LAYOUT PRINCIPAL: SIDEBAR IZQUIERDA + MARKETPLACE DERECHA ── -->
  <div class="max-w-[1440px] mx-auto px-4 sm:px-8 py-10 flex flex-col md:flex-row gap-8">
    
    <!-- ═══ SIDEBAR IZQUIERDO: Tarjetas de Categorías ═══ -->
    <aside class="w-full md:w-64 shrink-0 space-y-4" role="complementary" aria-label="Categorías visuales">
      
      <!-- Card 1: Bordadoras Industriales -->
      <a onclick="filterCategory(event, 'Bordadoras Industriales')" class="block relative h-36 rounded-2xl overflow-hidden group shadow-xs border border-slate-200 cursor-pointer" href="#product-grid">
        <img src="uploads/carousel_2.png" alt="Bordadoras Industriales" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
        <div class="absolute inset-0 bg-slate-900/60 flex items-end p-4 group-hover:bg-slate-900/40 transition-colors">
          <h3 class="text-white font-bold text-base font-headline leading-tight">Bordadoras<br/>Industriales</h3>
        </div>
      </a>

      <!-- Card 2: Maquinaria de Planchado -->
      <a onclick="filterCategory(event, 'Equipos de Planchado')" class="block relative h-36 rounded-2xl overflow-hidden group shadow-xs border border-slate-200 cursor-pointer" href="#product-grid">
        <img src="uploads/carousel_3.png" alt="Maquinaria de Planchado" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
        <div class="absolute inset-0 bg-slate-900/60 flex items-end p-4 group-hover:bg-slate-900/40 transition-colors">
          <h3 class="text-white font-bold text-base font-headline leading-tight">Maquinaria de<br/>Planchado</h3>
        </div>
      </a>

      <!-- Card 3: Corte Automático -->
      <a onclick="filterCategory(event, 'Cortadoras')" class="block relative h-36 rounded-2xl overflow-hidden group shadow-xs border border-slate-200 cursor-pointer" href="#product-grid">
        <img src="uploads/0b39b704e01a408ba83ecc3bcb9daa37.jpg" alt="Corte Automático" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
        <div class="absolute inset-0 bg-slate-900/60 flex items-end p-4 group-hover:bg-slate-900/40 transition-colors">
          <h3 class="text-white font-bold text-base font-headline leading-tight">Corte<br/>Automático</h3>
        </div>
      </a>

      <!-- Card 4: Línea de Confección Industrial -->
      <a onclick="filterCategory(event, 'Confección Industrial')" class="block relative h-36 rounded-2xl overflow-hidden group shadow-xs border border-slate-200 cursor-pointer" href="#product-grid">
        <img src="uploads/carousel_1.png" alt="Línea de Confección Industrial" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
        <div class="absolute inset-0 bg-slate-900/60 flex items-end p-4 group-hover:bg-slate-900/40 transition-colors">
          <h3 class="text-white font-bold text-base font-headline leading-tight">Línea de<br/>Confección Industrial</h3>
        </div>
      </a>

    </aside>

    <!-- ═══ CONTENIDO DERECHA: Marketplace ═══ -->
    <section class="flex-1" role="main">
      <header class="mb-6">
        <span class="bg-[#1A2536] text-white text-[10px] font-extrabold px-3 py-1 rounded-sm uppercase tracking-widest inline-block mb-3">MARKETPLACE 2026</span>
        <h1 id="inventario-hero-title" class="text-2xl sm:text-3xl font-black font-headline text-slate-900 uppercase tracking-tight leading-snug">
          LÍNEA INDUSTRIAL DE CONFECCION, BORDADO, CORTE Y PLANCHADO.
        </h1>
        <p id="inventario-hero-desc" class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1">
          SUMINISTRO DE EQUIPOS DE CONFECCION INDUSTRIAL CON TECNOLOGIA DE ULTIMA GENERACION
        </p>
      </header>

      <!-- Grilla de Productos: 4 columnas -->
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

      <!-- Botón Cargar Más Marketplace -->
      <div class="mt-10 flex justify-center">
        <button id="load-more-btn" onclick="loadMoreProducts()" class="px-8 py-3.5 bg-[#1A2536] hover:bg-slate-800 text-white font-black text-xs uppercase tracking-wider rounded-md transition-colors shadow-md">
          CARGAR MÁS MARKETPLACE
        </button>
      </div>
    </section>

  </div>

</main>

<!-- ═══ FOOTER (inyectado dinámicamente por shared.js) ═══ -->
<div id="footer-placeholder"></div>

<!-- Page-specific data renderer -->
<script src="products.js"></script>
</body>
</html>
